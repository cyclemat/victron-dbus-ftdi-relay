[general]
# FTDI-Seriennummer des Boards (anzeigen: python3 dbus_ftdi_relay.py --list).
# PFLICHT fuer den Dienst: Sie stellt sicher, dass nur dieses Board angefasst
# wird und nicht z. B. ein VE.Direct-USB-Kabel (ebenfalls FTDI). Ausserdem
# wird genau dieses Board vom serial-starter ausgenommen.
serial =

# Geraetename in der GUI (laesst sich dort auch aendern)
name = USB-Relais
channels = 8

# true, wenn das Board bei 0-Bits anzieht
invert = false

# Nach Neustart oder USB-Wiederverbindung:
#   restore = letzten Zustand wiederherstellen (Taster immer aus)
#   off     = alle Relais aus
startup = restore

# Pruefintervall in Sekunden (Pins zuruecklesen, Wiederverbindung)
poll_interval = 2
device_instance = 50
# Gruppenname fuer die Schalter-Kachel (leer = nach Geraet gruppieren)
group =
log_level = info

# Product-IDs (hex), die beruecksichtigt werden. Standard: 6001 (FT245R/FT232R).
# Nur aendern, wenn --list dein Board ohne * anzeigt.
# product_ids = 6001

[names]
# Standardnamen; umbenennen geht auch direkt in der GUI
1 = Relais 1
2 = Relais 2
3 = Relais 3
4 = Relais 4
5 = Relais 5
6 = Relais 6
7 = Relais 7
8 = Relais 8
